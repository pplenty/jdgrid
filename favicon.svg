<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .core { fill: #0f172a; }
    .ring { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .core { fill: #f1f5f9; }
      .ring { stroke: #f1f5f9; }
    }
  </style>
  <!-- Outer ring (galactic disk) -->
  <circle class="ring" cx="16" cy="16" r="11" fill="none" stroke-width="1.4" opacity="0.55" />
  <!-- Center core -->
  <circle class="core" cx="16" cy="16" r="4" />
</svg>
