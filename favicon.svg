<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .galaxy { fill: #0f172a; }
    .arm { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .galaxy { fill: #f1f5f9; }
      .arm { stroke: #f1f5f9; }
    }
  </style>
  <!-- Subtle spiral arms (visible at larger sizes) -->
  <g class="arm" fill="none" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <path d="M 16 16 C 19 13, 23 12, 26 14" />
    <path d="M 16 16 C 13 19, 9 20, 6 18" />
  </g>
  <!-- Dots: center + spiral arms -->
  <g class="galaxy">
    <circle cx="16" cy="16" r="2.6" />
    <circle cx="20" cy="13.5" r="1.4" />
    <circle cx="24" cy="12" r="1.1" />
    <circle cx="27" cy="14.5" r="0.8" />
    <circle cx="12" cy="18.5" r="1.4" />
    <circle cx="8" cy="20" r="1.1" />
    <circle cx="5" cy="17.5" r="0.8" />
  </g>
</svg>
