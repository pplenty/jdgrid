<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .galaxy { fill: #0f172a; }
    .arm { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .galaxy { fill: #f1f5f9; }
      .arm { stroke: #f1f5f9; }
    }
  </style>
  <g transform="rotate(-22 16 16)">
    <!-- Outer disk (subtle ellipse outline) -->
    <ellipse class="arm" cx="16" cy="16" rx="14" ry="4" fill="none" stroke-width="0.6" opacity="0.25" />
    <!-- Two long spiral arms (sweeping) -->
    <g class="arm" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
      <path d="M 29 16 C 23 15.5, 19 16, 17 17.5 C 14 19, 10 19, 4 17" />
      <path d="M 3 16 C 9 16.5, 13 16, 15 14.5 C 18 13, 22 13, 28 15" />
    </g>
    <!-- Galactic bulge (tilted ellipse, bright) -->
    <ellipse class="galaxy" cx="16" cy="16" rx="3.5" ry="2" />
    <!-- Scattered stars along arms -->
    <g class="galaxy">
      <circle cx="25" cy="14.5" r="0.7" opacity="0.9" />
      <circle cx="7" cy="17.5" r="0.7" opacity="0.9" />
      <circle cx="22" cy="13" r="0.45" opacity="0.7" />
      <circle cx="10" cy="19" r="0.45" opacity="0.7" />
    </g>
  </g>
</svg>
