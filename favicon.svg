<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    .galaxy { fill: #0f172a; }
    .arm { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .galaxy { fill: #f1f5f9; }
      .arm { stroke: #f1f5f9; }
    }
  </style>
  <!-- 3 spiral arms (hero 와 같은 로그 스파이럴 공식) -->
  <g class="arm" fill="none" stroke-width="0.8" stroke-linecap="round" opacity="0.35">
    <path d="M 16 16 C 22 20, 20 26, 11.6 29.3" />
    <path d="M 16 16 C 10 17, 6 11, 6.5 5.8" />
    <path d="M 16 16 C 19 10, 26 10, 29.8 13" />
  </g>
  <!-- 점 — 각 팔에 3 개씩, 중심에서 멀어질수록 작아짐 -->
  <g class="galaxy">
    <circle cx="20.5" cy="21.8" r="1.5" />
    <circle cx="17.1" cy="26.6" r="1" />
    <circle cx="11.6" cy="29.3" r="0.6" />
    <circle cx="8.7" cy="17" r="1.5" />
    <circle cx="6.2" cy="11.7" r="1" />
    <circle cx="6.5" cy="5.8" r="0.6" />
    <circle cx="18.8" cy="9.2" r="1.5" />
    <circle cx="24.7" cy="9.8" r="1" />
    <circle cx="29.8" cy="13" r="0.6" />
  </g>
  <!-- Central core -->
  <circle class="galaxy" cx="16" cy="16" r="2.5" />
</svg>
