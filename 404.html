<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — jdgrid</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="2; url=/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 즉시 home. replace 라 back 버튼이 404 로 돌아가지 않음.
      // `/` 는 _redirects 의 명시 통과 200 rewrite 라 무한 루프 위험 0.
      location.replace("/");
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --fg-muted: #475569;
        --fg-subtle: #94a3b8;
        --accent: #475569;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #f1f5f9;
          --fg-muted: #94a3b8;
          --fg-subtle: #64748b;
          --accent: #cbd5e1;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Noto Sans KR", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .box { text-align: center; max-width: 360px; }
      .code {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-subtle);
        margin-bottom: 14px;
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      p {
        color: var(--fg-muted);
        margin: 0;
        font-size: 14px;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      a:hover { color: var(--fg); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <h1>없는 페이지예요</h1>
      <p>잠시 후 <a href="/">홈</a>으로 이동합니다.</p>
    </div>
  </body>
</html>
